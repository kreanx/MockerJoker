<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    body { margin: 0; padding: 0; background: var(--ctp-base, #1e1e2e); color: var(--ctp-text, #cdd6f4); font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="text" id="filterInput" placeholder="Фильтр...">
    <div id="statusFilters">
      <button class="sf-btn active" data-filter="all">Все</button>
      <button class="sf-btn" data-filter="mocked">Mock</button>
      <button class="sf-btn" data-filter="2xx">2xx</button>
      <button class="sf-btn" data-filter="4xx">4xx</button>
      <button class="sf-btn" data-filter="5xx">5xx</button>
    </div>
    <span id="countLabel"></span>
    <button id="clearBtn">Очистить</button>
    <button id="bpBtn" class="bp-btn" title="Точки останова">⛔</button>
  </div>
  <div id="tableWrap">
    <table id="interceptionTable">
      <thead>
        <tr>
          <th class="col-time">Время</th>
          <th class="col-method">Метод</th>
          <th class="col-url" style="width:auto">URL</th>
          <th class="col-status">Статус</th>
          <th class="col-size">Размер</th>
          <th class="col-action">Действие</th>
          <th class="col-rule">Правило</th>
          <th class="col-bp" title="Точка останова">ТЗ</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
  <div id="hSplitHandle"></div>
  <div id="detailPanel" class="hidden">
    <div id="detailHeader">
      <span id="detailTitle">Выберите запрос</span>
      <button id="closeDetail" title="Скрыть">&times;</button>
    </div>
    <div id="detailBody">
      <div id="detailLeft">
        <div id="detailTabs">
          <button class="dt-tab active" data-tab="general">Общее</button>
          <button class="dt-tab" data-tab="headers">Заголовки</button>
          <button class="dt-tab dt-tab-orig hidden" data-tab="original">Оригинал</button>
        </div>
        <div id="detailContent">
          <div id="tab-general" class="dt-pane active"></div>
          <div id="tab-headers" class="dt-pane"></div>
          <div id="tab-original" class="dt-pane"><div class="orig-search-bar"><input type="text" id="origSearchInput" placeholder="Поиск..." /><span id="origSearchCount" class="resp-search-count"></span><button id="origSearchPrev" class="resp-search-btn" title="Назад">&lsaquo;</button><button id="origSearchNext" class="resp-search-btn" title="Вперёд">&rsaquo;</button></div><div id="origContent"></div></div>
        </div>
      </div>
      <div id="detailRight">
        <div class="resp-header">
          <span class="section-label">Ответ</span>
          <div class="resp-search-bar">
            <input type="text" id="respSearchInput" placeholder="Поиск..." />
            <span id="respSearchCount" class="resp-search-count"></span>
            <button id="respSearchPrev" class="resp-search-btn" title="Назад">&lsaquo;</button>
            <button id="respSearchNext" class="resp-search-btn" title="Вперёд">&rsaquo;</button>
          </div>
        </div>
        <div id="responseView" class="response-view">
          <span class="empty">— выберите запрос —</span>
        </div>
      </div>
    </div>
  </div>
  <div id="ctxMenu" class="ctx-menu hidden">
    <div data-action="mock">Замокать запрос</div>
    <div data-action="bpReq">⛔ Точка останова (запрос)</div>
    <div data-action="bpResp">⛔ Точка останова (ответ)</div>
  </div>
  <div id="bpOverlay" class="bp-overlay hidden">
    <div class="bp-modal">
      <div class="bp-modal-header">
        <span id="bpModalTitle">⛔ Breakpoint</span>
      </div>
      <div class="bp-modal-body" id="bpModalBody"></div>
      <div class="bp-modal-actions">
        <button id="bpResume" class="dt-btn dt-btn-accent">Продолжить</button>
        <button id="bpAbort" class="dt-btn">Отменить</button>
      </div>
    </div>
  </div>
  <div id="bpListOverlay" class="bp-overlay hidden">
    <div class="bp-modal bp-modal-wide">
      <div class="bp-modal-header">
        <span>⛔ Точки останова</span>
        <button id="bpAddBtn" class="dt-btn dt-btn-accent" style="font-size:11px;padding:3px 10px">+ Добавить</button>
      </div>
      <div class="bp-modal-body" id="bpListBody"></div>
    </div>
  </div>
  <div id="bpConfigOverlay" class="bp-overlay hidden">
    <div class="bp-modal bp-modal-wide">
      <div class="bp-modal-header">
        <span id="bpConfigTitle">Новая точка останова</span>
      </div>
      <div class="bp-modal-body" id="bpConfigBody">
        <div class="bp-field">
          <label>URL-паттерн</label>
          <input type="text" id="bpCfgUrl" class="bp-url-input" placeholder="полный URL или маска */api/*">
        </div>
        <div class="bp-cfg-row">
          <div class="bp-field" style="flex:1">
            <label>Фаза</label>
            <select id="bpCfgPhase" class="bp-phase-select" style="width:100%">
              <option value="request">Запрос</option>
              <option value="response">Ответ</option>
            </select>
          </div>
          <div class="bp-field" style="flex:1">
            <label>Метод</label>
            <select id="bpCfgMethod" class="bp-phase-select" style="width:100%">
              <option value="ANY">ANY</option>
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
              <option value="PATCH">PATCH</option>
            </select>
          </div>
        </div>
        <div class="bp-extract">
          <label>Извлечение переменных</label>
          <div id="bpCfgExtracts"></div>
          <button id="bpCfgAddExtract" class="dt-btn" style="font-size:11px;padding:3px 10px;margin-top:6px">+ Переменная</button>
        </div>
      </div>
      <div class="bp-modal-actions">
        <button id="bpCfgSave" class="dt-btn dt-btn-accent">Сохранить</button>
        <button id="bpCfgCancel" class="dt-btn">Отмена</button>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
