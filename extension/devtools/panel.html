<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    body { margin: 0; padding: 8px; background: var(--bg-primary, #1e1e2e); color: var(--text-primary, #cdd6f4); font-size: 13px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="text" id="filterInput" placeholder="Фильтр по URL, правилу или методу...">
    <button id="clearBtn">Очистить</button>
  </div>
  <table id="interceptionTable">
    <thead>
      <tr>
        <th>Время</th>
        <th>Метод</th>
        <th>URL</th>
        <th>Статус</th>
        <th>Действие</th>
        <th>Правило</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
</body>
</html>
