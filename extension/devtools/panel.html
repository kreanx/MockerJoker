<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    body { margin: 0; padding: 0; background: var(--bg-primary, #1e1e2e); color: var(--text-primary, #cdd6f4); font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="text" id="filterInput" placeholder="Фильтр...">
    <div id="statusFilters">
      <button class="sf-btn active" data-filter="all">Все</button>
      <button class="sf-btn" data-filter="mocked">Mock</button>
      <button class="sf-btn" data-filter="2xx">2xx</button>
      <button class="sf-btn" data-filter="4xx">4xx</button>
      <button class="sf-btn" data-filter="5xx">5xx</button>
    </div>
    <span id="countLabel"></span>
    <button id="clearBtn">Очистить</button>
  </div>
  <div id="tableWrap">
    <table id="interceptionTable">
      <thead>
        <tr>
          <th class="col-time" style="width:58px">Время</th>
          <th class="col-method" style="width:52px">Метод</th>
          <th class="col-url" style="width:auto">URL</th>
          <th class="col-status" style="width:48px">Статус</th>
          <th class="col-size" style="width:54px">Размер</th>
          <th class="col-action" style="width:74px">Действие</th>
          <th class="col-rule" style="width:90px">Правило</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
  <div id="splitHandle"></div>
  <div id="detailPanel" class="hidden">
    <div id="detailHeader">
      <span id="detailTitle"></span>
      <button id="closeDetail" title="Закрыть">&times;</button>
    </div>
    <div id="detailTabs">
      <button class="dt-tab active" data-tab="general">Общее</button>
      <button class="dt-tab" data-tab="headers">Заголовки</button>
      <button class="dt-tab" data-tab="body">Ответ</button>
      <button class="dt-tab dt-tab-orig hidden" data-tab="original">Оригинал</button>
    </div>
    <div id="detailContent">
      <div id="tab-general" class="dt-pane active"></div>
      <div id="tab-headers" class="dt-pane"></div>
      <div id="tab-body" class="dt-pane"></div>
      <div id="tab-original" class="dt-pane"></div>
    </div>
  </div>
  <div id="ctxMenu" class="ctx-menu hidden">
    <div>Замокать запрос</div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
